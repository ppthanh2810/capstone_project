# Stage 3 (Nav2 Humble): planner_server + global_costmap + A* (luôn chạy)
# + Stage 3.2: controller_server + local_costmap + DWB (chỉ khi chạy navigation.launch.py).
# KHÔNG có BT navigator/map_server/AMCL ở đây: /map và TF map -> odom -> base_footprint
# đến từ Stage 2 (slam_toolbox HOẶC map_server + AMCL) và Stage 1 (EKF).

planner_server:
  ros__parameters:
    use_sim_time: false
    # Chỉ lập kế hoạch theo yêu cầu (action ComputePathToPose), không tự replan.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # A* thay vì Dijkstra (NavFn của Nav2).
      use_astar: true
      # false: không lập đường qua ô unknown (an toàn). Ghi đè bằng planning/navigation.launch.py allow_unknown:=true
      # (hữu ích khi mapping, bản đồ còn nhiều vùng chưa quét).
      allow_unknown: false
      # 0.0: đích phải nằm ở ô hợp lệ; đích trong vật cản / vùng inflation nội tiếp / unknown -> lỗi rõ ràng
      # thay vì âm thầm dời đích.
      tolerance: 0.0
      # false: hướng pose cuối = hướng Goal Pose chọn trên RViz.
      use_final_approach_orientation: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      # Robot tròn Ø400 mm.
      robot_radius: 0.20
      # Cập nhật/công bố chậm là đủ: chỉ có lớp tĩnh (bản đồ) + inflation.
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      # Kích thước/origin lấy theo /map (static layer). Với slam_toolbox, costmap tự đổi kích thước khi map lớn ra.
      rolling_window: false
      resolution: 0.05
      # Giữ ô unknown (255) thay vì coi là free; NavFn quyết định theo allow_unknown.
      track_unknown_space: true
      # Đọc bởi StaticLayer (tham số cấp costmap): ô /map >= 100 -> lethal, -1 (255) -> unknown,
      # còn lại free (trinary, giống mode trinary của maps/map.yaml).
      lethal_cost_threshold: 100
      unknown_cost_value: 255
      trinary_costmap: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        # map_server và slam_toolbox đều publish /map transient_local.
        map_subscribe_transient_local: true
        # slam_toolbox / map_server không publish /map_updates đáng tin -> nhận cả map mới mỗi lần.
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Khoảng an toàn: bán kính 0.20 m (nội tiếp, NavFn coi như vật cản) + vùng chi phí giảm dần tới 0.40 m
        # -> đường ưu tiên đi cách tường, nhưng vẫn qua được khe >= 0.40 m.
        inflation_radius: 0.40
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false

# Riêng cho planner_server (không quản lý map_server/AMCL: chúng thuộc Stage 2).
lifecycle_manager_planning:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["planner_server"]
    # 0.0: tắt bond. planner_server chỉ active khi có TF map -> base_footprint (AMCL cần initial pose),
    # nên không để lifecycle manager coi việc chờ TF là node chết.
    bond_timeout: 0.0
    attempt_respawn_reconnection: false

# Riêng cho controller_server (navigation.launch.py, Stage 3.2).
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server"]
    # 0.0: tắt bond, cùng lý do như lifecycle_manager_planning (local_costmap chờ TF odom -> base_footprint).
    bond_timeout: 0.0
    attempt_respawn_reconnection: false

goal_path_bridge:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    goal_topic: /goal_pose
    path_topic: /global_path
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    action_name: /compute_path_to_pose
    planner_id: GridBased
    # Thời gian chờ action server (planner_server đã active) cho mỗi goal.
    server_wait_timeout: 2.0
    # TF map -> base_footprint cũ hơn giá trị này -> cảnh báo (pose có thể đã sai);
    # với FollowPath thì từ chối gửi.
    tf_timeout: 0.5
    # ---- Stage 3.2: A* path -> FollowPath (DWB). Chỉnh được khi chạy bằng `ros2 param set`.
    follow_action_name: /follow_path
    controller_id: FollowPath               # = controller_plugins của controller_server
    goal_checker_id: general_goal_checker   # = goal_checker_plugins của controller_server
    # false: chỉ gửi FollowPath khi gọi service /goal_path_bridge/follow (kích hoạt có chủ đích).
    # Ghi đè bằng navigation.launch.py auto_follow:=true (planning.launch.py luôn false).
    auto_follow: false
    max_path_age: 30.0          # s; đường cũ hơn -> từ chối, phải đặt lại Goal (<= 0: tắt kiểm tra)
    max_start_distance: 0.5     # m; robot cách đường xa hơn -> đường lỗi thời, từ chối
    follow_timeout: 120.0       # s; quá thời gian -> hủy FollowPath (<= 0: tắt)
    # true: chỉ bám đường khi /localization/status (localization_monitor) = OK (LOCALIZED) và còn mới;
    # mất LOCALIZED khi đang bám -> hủy. navigation.launch.py đặt false khi mode:=mapping hoặc monitor:=false.
    require_localized: true
    localization_status_topic: /localization/status
    localization_status_timeout: 2.0   # s (monitor publish 2 Hz)
    # Đang bám đường: UNCERTAIN/INITIALIZING liên tục <= mức này được bỏ qua (LOST, status cũ -> hủy ngay).
    # Robot 2026-10-14: UNCERTAIN chập chờn 0.5-1 s khi quay/đi làm 6/8 lượt bị hủy. Bắt đầu vẫn đòi LOCALIZED.
    localization_uncertain_grace: 2.0  # s

# ============================================================================================
# Stage 3.2 — DWB local controller (chỉ chạy trong navigation.launch.py)
# Đầu ra cmd_vel được navigation.launch.py remap:
#   navigation_enabled:=false (mặc định) -> /cmd_vel_dwb  (KHÔNG node nào nghe -> cách ly motor)
#   navigation_enabled:=true             -> /cmd_vel_nav  (twist_mux prio 10 < PS4 prio 100 -> motor)
# Giới hạn vận tốc/gia tốc dưới đây là GIÁ TRỊ KHỞI ĐẦU THẬN TRỌNG, CHƯA ĐO trên robot (NOT_VERIFIED).
# Căn cứ hiện có: teleop PS4 tối đa 0.5 m/s, 0.6 rad/s (stage0 ps4.yaml); zlac8015d_move đặt
# accel/decel time 1000 ms trong driver; watchdog 0.5 s; bánh r = 0.0535 m, track 0.34 m
# (0.15 m/s ~ 27 RPM mỗi bánh). Phải đo lại trước khi tăng.
# ============================================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    # 10 Hz: /wheel_feedback 20 Hz, EKF 30 Hz, LiDAR C1 ~10 Hz.
    controller_frequency: 10.0
    # Odometry đã fuse của EKF (Stage 1); DWB dùng vận tốc hiện tại để tính dynamic window.
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5      # robot vi sai: không có vy
    min_theta_velocity_threshold: 0.001
    # Cho phép DWB thất bại tối đa 0.3 s liên tiếp trước khi abort FollowPath (rồi phát vận tốc 0).
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    # Hai bộ điều khiển cục bộ cùng được nạp; goal_path_bridge chọn bằng controller_id
    # (navigation.launch.py local_planner:=custom -> "CustomDWB", local_planner:=nav2_dwb -> "FollowPath").
    controller_plugins: ["FollowPath", "CustomDWB"]

    # Không di chuyển được >= 0.25 m trong 10 s -> abort (kẹt, bị chặn).
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15      # m, ~3 ô bản đồ; localization AMCL/CSM chưa đánh giá chính xác hơn
      yaw_goal_tolerance: 0.25     # rad (~14 deg)

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # ---- Động học (NOT_VERIFIED, chỉnh được) ----
      # min_vel_x = 0: KHÔNG chạy lùi. LiDAR chỉ quan sát phía trước ±90° (phía sau bị laptop che),
      # nên không được tự động lùi vào vùng không quan sát được.
      min_vel_x: 0.0
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      # ---- Lấy mẫu / mô phỏng quỹ đạo ----
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7                # s nhìn trước (0.15 m/s -> ~0.26 m)
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15      # giống general_goal_checker
      # Dưới ngưỡng này robot coi như đã dừng (RotateToGoal xoay tại chỗ ở đích).
      # Phải < max_vel_x (mặc định Nav2 0.25 > 0.15 sẽ luôn coi là "đã dừng").
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      # Chỉ xét phần đường A* trong cửa sổ local costmap.
      prune_plan: true
      prune_distance: 1.5
      forward_prune_distance: 1.5     # thực tế đường bị cắt ở mép local costmap (xem local_costmap.width)
      shorten_transformed_plan: true
      # ---- Critics: bám Global Path, tránh vật cản, giảm dao động, tiếp cận Goal ----
      # Trọng số = mặc định Nav2 Humble (nav2_bringup), chưa tinh chỉnh cho robot này.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02        # tránh vật cản (ô lethal/nội tiếp trên local costmap -> loại quỹ đạo)
      PathAlign.scale: 32.0           # hướng theo đường A*
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0           # hướng về đích
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0            # bám sát đường A*
      GoalDist.scale: 24.0            # tiến về đích
      RotateToGoal.scale: 32.0        # xoay đúng hướng Goal Pose khi đã tới vị trí
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      # Oscillation: phạt quỹ đạo đổi chiều liên tục (dùng tham số mặc định của critic).

    # ==========================================================================================
    # CustomDWB — bộ điều khiển Dynamic Window TỰ VIẾT
    #   thuật toán: stage3_navigation/src/dwa_core.cpp, lớp vỏ ROS: src/dwb_controller.cpp
    #   tài liệu: stage3_navigation/README.md
    # Mọi tham số chỉnh được khi đang chạy (cả lô được kiểm tra nguyên tử; giá trị sai -> từ chối, giữ cũ):
    #   ros2 param set /controller_server CustomDWB.<tên> <giá trị>     (số thực phải ghi dạng 5.0)
    # Giới hạn động học / trễ = giá trị khởi đầu thận trọng, NOT_VERIFIED trên robot (chưa đo).
    # Tuning né vật cản 2026-10-21 (mô phỏng kín vòng lõi DWA, 23 kịch bản x 5 seed x 4 mô hình robot):
    #   7 loại vật cản chắn đường: cũ 0/35 né được (dừng -> abort) -> mới 34-35/35 (robot trễ 0.7 s: 27/35);
    #   0 va chạm, khoảng hở thân >= 0.14 m (robot trễ: 0.09 m). Giá trị cũ ghi trong "(cũ ...)".
    # ==========================================================================================
    CustomDWB:
      plugin: "stage3_navigation::DwbController"
      # ---- Giới hạn động học (lệnh LUÔN nằm trong [min_vel_x, max_vel_x] và |ω| <= max_vel_theta) ----
      max_vel_x: 0.3               # m/s (cũ 0.15). Nếu hạ về 0.2 thì tăng sim_time lên 3.0 (giữ tầm nhìn ~0.6 m)
      min_vel_x: 0.0               # 0 = không lùi (phía sau không có LiDAR); plugin từ chối giá trị < 0
      max_vel_theta: 1.0           # rad/s (cũ 0.5)
      min_in_place_vel_theta: 0.1  # rad/s, |ω| tối thiểu khi xoay tại chỗ (thắng ma sát) - NOT_VERIFIED
      acc_lim_x: 0.5               # m/s², tăng |v|
      decel_lim_x: 0.5             # m/s², giảm |v| (giá trị DƯƠNG; Nav2 DWB dùng số âm)
      # Cửa sổ ω mỗi chu kỳ = ± acc·dt. 1.0 -> chỉ ±0.1 rad/s: mọi ứng viên lệch ngang < 4 cm trong chân trời
      # -> chi phí vật cản như nhau -> robot không bao giờ rẽ né (nguyên nhân chính). 2.0 -> ±0.2 rad/s.
      # 2.0 rad/s² ~ 0.34 m/s² ở bánh xe (< acc_lim_x). Robot thật chưa đo: mô phỏng robot chỉ đạt 1.0 vẫn 0 va chạm.
      acc_lim_theta: 2.0           # rad/s², tăng |ω| (cũ 1.0)
      decel_lim_theta: 2.0         # rad/s², giảm |ω| (giá trị dương; cũ 1.0)
      # ---- Lấy mẫu dynamic window + mô phỏng ----
      # Cửa sổ = tập (v, ω) đạt được trong 1 chu kỳ (dt = 1/controller_frequency) từ vận tốc ĐO. Luôn có thêm mẫu
      # v = 0 / ω = 0 nếu đạt được. Tải: vx * (vθ+1) * bước <= 100000 pose/chu kỳ (kiểm tra khi set).
      vx_samples: 20
      vtheta_samples: 21
      sim_time: 2.0                # s chân trời chấm điểm (0.3 m/s -> ~0.6 m; cũ 1.7)
      sim_granularity: 0.05        # s bước tối đa; bước còn bị giới hạn để quét <= nửa ô costmap
      # ---- Mô hình an toàn (quỹ đạo phải phanh dừng được trước vật cản) ----
      # Mỗi ứng viên được mô phỏng: [0, latency) theo lệnh trước -> chuyển tiếp có giới hạn gia tốc -> giữ lệnh;
      # cộng đuôi phanh từ latency + dt (decel_lim_x / decel_lim_theta) + stopping_margin phía trước.
      control_latency: 0.2         # s, trễ lệnh -> /odometry/filtered ĐO trên robot 2026-10-14 (bag rot_debug,
                                   # driver accel/decel 200 ms; một lượt xoay)
      stopping_margin: 0.02        # m, biên bất định thêm sau khi dừng hẳn (cũ 0.05; quãng phanh thật chưa đo)
      # ---- Gốc của dynamic window ----
      # command: cửa sổ + bước acc/decel tính từ LỆNH TRƯỚC, kẹp trong ± max_feedback_gap_* quanh vận tốc đo.
      # measured: tính từ vận tốc đo (hành vi cũ). Robot 2026-10-14: phản hồi trễ ~0.7-0.8 s -> gia tốc/phanh
      # góc thực ~0.12 rad/s² -> xoay lố ~50° -> ROTATE_TO_PATH lại -> "Failed to make progress".
      # Mô phỏng (robot laggy, trễ 0.7 s): measured 17 lần chạy sai kỳ vọng, command 0. Mô phỏng quỹ đạo vẫn
      # bắt đầu từ vận tốc đo. Pha xoay giới hạn ω <= sqrt(2·decel_lim_theta·góc còn lại sau control_latency).
      velocity_reference: "command"
      max_feedback_gap_x: 0.15     # m/s, |gốc - v đo| tối đa (PS4 chiếm twist_mux / bánh kẹt -> bám vận tốc đo)
      max_feedback_gap_theta: 0.5  # rad/s
      # ---- Đường cục bộ + cà rốt ----
      local_plan_length: 1.5       # m đường A* phía trước được xét (còn bị cắt ở mép local costmap)
      # Cà rốt xa hơn -> nằm SAU vật cản nhỏ, kéo robot đi tiếp thay vì quay mặt vào vật cản.
      carrot_distance: 0.8         # m, điểm dẫn hướng dọc đường A* (cũ 0.6)
      closest_search_distance: 1.0 # m, cửa sổ tìm tiến trình phía trước (theo độ dài cung, không nhảy nhánh)
      # Đường vòng quanh vật cản lệch tới ~0.8 m (người/hộp 0.3 m) -> 0.8 cắt ngang lúc đang vòng.
      max_path_deviation: 1.0      # m, robot lệch đường A* hơn mức này -> từ chối (lệnh 0, abort; cũ 0.8)
      # ---- Xoay tại chỗ ----
      # 0.8: đang vòng né (hướng lệch cà rốt ~1 rad) thì bị ép xoay tại chỗ QUAY LẠI vật cản -> kẹt.
      # 2.5 (~143°): chỉ xoay tại chỗ khi đích/đường ở gần sau lưng; góc nhỏ hơn -> đi theo cung (rộng hơn trước).
      rotate_to_heading_angle: 2.5 # rad: lệch hướng tới cà rốt > ngưỡng -> xoay tại chỗ (thoát khi < 1.25; cũ 0.8)
      rotate_gain: 1.5             # ω = gain * sai số góc
      # ---- Đích ----
      # Dung sai THỰC lấy từ goal checker của FollowPath (general_goal_checker.getTolerances()); hai giá trị dưới
      # chỉ dùng khi checker không cung cấp (có cảnh báo nếu khác checker).
      xy_goal_tolerance: 0.15      # m, dự phòng
      yaw_goal_tolerance: 0.25     # rad, dự phòng
      goal_tolerance_fraction: 0.9 # vào ROTATE_TO_GOAL khi d < 0.9*xy_tol; dừng xoay khi |yaw| < 0.9*yaw_tol
      goal_latch_release_margin: 0.05  # m, trôi ra ngoài xy_tol + 0.05 -> tiếp cận lại
      # ---- Hàm chi phí MỀM: tổng = Σ scale * thành phần (nhỏ hơn = tốt hơn) ----
      # Va chạm / unknown / ngoài costmap / không phanh kịp là ràng buộc CỨNG (loại quỹ đạo), không nằm ở đây.
      # Thang: path, carrot tính bằng m; heading, obstacle, speed, oscillation trong [0, 1].
      # Ưu tiên né hơn bám đường: cũ path 4.0 vs obstacle 0.5 -> lệch 0.3 m tốn 1.2, vật cản tối đa chỉ 0.5.
      # speed phải đủ lớn: ứng viên đứng yên (v = 0) KHÔNG bị tính chi phí vật cản, nên obstacle lớn mà speed nhỏ
      # -> robot chọn đứng im. Quét 432 + 162 tổ hợp; vùng tốt: path 0.3-0.5, obstacle 3-5, speed 1.0-1.5.
      path_distance_scale: 0.5     # x khoảng cách cuối quỹ đạo -> đường A* (m): bám đường (cũ 4.0)
      carrot_distance_scale: 2.0   # x khoảng cách cuối quỹ đạo -> cà rốt (m): tiến về đích
      heading_scale: 0.3           # x lệch hướng tới cà rốt / π: hướng đầu đúng đường (cũ 1.0)
      obstacle_scale: 4.0          # x chi phí costmap lớn nhất dọc cung dài max_vel_x*sim_time / 252 (cũ 0.5)
      speed_scale: 1.5             # x (max_vel_x - v)/max_vel_x: phạt đứng yên/đi chậm (không lấn ràng buộc cứng; cũ 0.3)
      oscillation_scale: 1.0       # phạt ω quay lại chiều cũ ngay sau một lần đổi chiều
      # ---- Chống dao động: hết "vừa đổi chiều" khi đi > dist, xoay > angle, hoặc sau time ----
      oscillation_reset_dist: 0.05 # m
      oscillation_reset_angle: 0.2 # rad
      oscillation_reset_time: 2.0  # s (> 0: không khóa chiều xoay vô hạn)
      # ---- Dữ liệu / TF (thiếu hoặc cũ -> PlannerException -> controller_server phát lệnh 0, abort) ----
      unknown_is_obstacle: true    # CHỈ có tác dụng khi local costmap track_unknown_space: true (hiện false)
      transform_tolerance: 0.3     # s, thời gian CHỜ TF (không phải tuổi)
      max_tf_age: 1.0              # s, tuổi tối đa TF map -> odom (AMCL đóng dấu +1.0 s vào tương lai)
      max_pose_age: 0.5            # s, tuổi tối đa TF odom -> base_footprint (EKF 30 Hz)
      odom_timeout: 0.5            # s, /odometry/filtered im lặng lâu hơn -> dừng
      collision_check: "auto"      # auto: footprint tròn (robot_radius) -> ô tâm; đa giác -> thêm viền footprint
      # ---- Hiển thị / chẩn đoán ----
      publish_trajectories: true   # /CustomDWB/trajectories (MarkerArray)
      trajectory_marker_stride: 4  # vẽ 1/4 số quỹ đạo ứng viên
      debug_publish_rate: 5.0      # Hz cho marker + /CustomDWB/state (DiagnosticStatus); 0 = tắt

# Local costmap (node con của controller_server): rolling window quanh robot trong frame odom.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      # Robot tròn Ø400 mm (giống global_costmap) + biên an toàn 0.05 m -> bán kính nội tiếp 0.25 m (Ø50 cm).
      # 2026-10-21 (user): 0.10 -> 0.05 để đi sát / qua khe hẹp hơn. Mô phỏng (bộ trọng số né vật cản mới):
      #   khe 0.58 m và 0.64 m: 0/5 -> 5/5 qua được (khe 0.54 m vẫn dừng); tỷ lệ né vật cản không đổi (35/35);
      #   0 va chạm nhưng khoảng hở thân nhỏ nhất 0.14 -> 0.05 m (robot trễ 0.7 s: 0.03 m).
      # Lịch sử offline (Nav2 DWB, trọng số cũ): padding 0 -> chạm; 0.05 -> hở 0.03 m; 0.10 -> 0.13 m.
      # NOT_VERIFIED trên robot; chỉnh được (0.10 = an toàn hơn).
      robot_radius: 0.20
      footprint_padding: 0.05
      rolling_window: true
      # 2 x 2 m (±1 m quanh robot). DWB lấy "đích cục bộ" (GoalDist/GoalAlign) = điểm cuối của đường A*
      # còn nằm trong local costmap (forward_prune_distance KHÔNG giới hạn được điều này ở DWB 1.1.20),
      # và GoalDist đo khoảng cách thẳng tới đích cục bộ. Cửa sổ 3 x 3 m: ở đầu tường, đích cục bộ nằm
      # SAU tường -> GoalDist kéo về phía tường, PathDist kéo theo đường vòng -> robot đứng yên ->
      # "Failed to make progress" (tái hiện offline). 2 x 2 m: đích cục bộ <= ~1 m, bám theo đường vòng.
      # Ở 0.15 m/s, sim_time 1.7 s chỉ nhìn trước ~0.26 m nên ±1 m là đủ cho tránh vật cản.
      width: 2
      height: 2
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1      # max
        observation_sources: scan
        scan:
          # /scan_filtered: chỉ có nửa trước (±90°), nửa sau = NaN -> ObstacleLayer bỏ qua (không đánh dấu,
          # không xóa). Vật cản đã đánh dấu rồi đi ra sau robot vẫn được giữ, không bị xóa.
          topic: /scan_filtered
          data_type: "LaserScan"
          sensor_frame: ""         # dùng frame_id của scan (laser_frame, URDF)
          marking: true
          clearing: true
          # false: tia inf (không có phản hồi, hoặc quá gần) KHÔNG dùng để xóa -> thận trọng.
          inf_is_valid: false
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0   # laser_frame cao ~0.35 m so với base_footprint
          # Scan cũ hơn 0.5 s -> costmap không "current" (LiDAR C1 ~10 Hz).
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 2026-10-21 (user): 0.45 -> 0.30. Vùng chi phí mềm chỉ còn 0.25-0.30 m (1 ô) quanh vật cản -> robot đi sát hơn,
        # obstacle_scale gần như chỉ còn tác dụng ở mép vùng cấm. Phải > bán kính nội tiếp 0.25 m.
        inflation_radius: 0.30
        cost_scaling_factor: 3.0
