# M2 bước 1 (đối chứng): camera_layer = nav2_costmap_2d::VoxelLayer riêng cho point cloud, TÁCH khỏi
# obstacle_layer (LiDAR), gộp bằng max. Nạp chồng lên nav2_params.yaml khi navigation.launch.py
# camera_layer:=voxel. Khác fusion_layer: không cần N frame liên tiếp (một frame nhiễu là đánh dấu), xóa bằng
# raytrace 3D của VoxelLayer (lỗ độ sâu không xóa; vật quá gần bị giữ), không có decay.
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["obstacle_layer", "camera_layer", "inflation_layer"]
      camera_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1           # max
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16                    # 0 .. 0.80 m
        unknown_threshold: 15
        mark_threshold: 0
        max_obstacle_height: 0.70
        observation_sources: depth
        depth:
          topic: /camera/camera/depth/color/points
          data_type: "PointCloud2"
          sensor_frame: ""
          marking: true
          clearing: true
          min_obstacle_height: 0.05     # NOT_VERIFIED (sàn bóng)
          max_obstacle_height: 0.70     # NOT_VERIFIED (chiều cao robot + laptop + 0.1 m)
          obstacle_min_range: 0.30
          obstacle_max_range: 2.5
          raytrace_min_range: 0.30
          raytrace_max_range: 3.0
          expected_update_rate: 1.0
          observation_persistence: 0.0
          inf_is_valid: false
