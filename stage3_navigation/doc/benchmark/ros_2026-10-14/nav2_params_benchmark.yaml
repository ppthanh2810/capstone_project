# Sinh tự động bởi run_benchmark.py từ /home/thanhpham/capstone_ws/install/stage3_navigation/share/stage3_navigation/config/nav2_params.yaml
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: true
      allow_unknown: false
      tolerance: 0.0
      use_final_approach_orientation: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.2
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      lethal_cost_threshold: 100
      unknown_cost_value: 255
      trinary_costmap: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false
lifecycle_manager_planning:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
    - planner_server
    bond_timeout: 0.0
    attempt_respawn_reconnection: false
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
    - controller_server
    bond_timeout: 0.0
    attempt_respawn_reconnection: false
goal_path_bridge:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    goal_topic: /goal_pose
    path_topic: /global_path
    map_topic: /map
    costmap_topic: /global_costmap/costmap
    action_name: /compute_path_to_pose
    planner_id: GridBased
    server_wait_timeout: 2.0
    tf_timeout: 0.5
    follow_action_name: /follow_path
    controller_id: FollowPath
    goal_checker_id: general_goal_checker
    auto_follow: false
    max_path_age: 30.0
    max_start_distance: 0.5
    follow_timeout: 120.0
    require_localized: true
    localization_status_topic: /localization/status
    localization_status_timeout: 2.0
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    - FollowPathLA
    - CustomDWB
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      prune_plan: true
      prune_distance: 1.5
      forward_prune_distance: 1.5
      shorten_transformed_plan: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    CustomDWB:
      plugin: stage3_navigation::DwbController
      max_vel_x: 0.15
      min_vel_x: 0.0
      max_vel_theta: 0.5
      min_in_place_vel_theta: 0.1
      acc_lim_x: 0.5
      decel_lim_x: 0.5
      acc_lim_theta: 1.0
      decel_lim_theta: 1.0
      vx_samples: 20
      vtheta_samples: 21
      sim_time: 1.7
      sim_granularity: 0.05
      control_latency: 0.1
      stopping_margin: 0.05
      local_plan_length: 1.5
      carrot_distance: 0.6
      closest_search_distance: 1.0
      max_path_deviation: 0.8
      rotate_to_heading_angle: 0.8
      rotate_gain: 1.5
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      goal_tolerance_fraction: 0.9
      goal_latch_release_margin: 0.05
      path_distance_scale: 4.0
      carrot_distance_scale: 2.0
      heading_scale: 1.0
      obstacle_scale: 0.5
      speed_scale: 0.3
      oscillation_scale: 1.0
      oscillation_reset_dist: 0.05
      oscillation_reset_angle: 0.2
      oscillation_reset_time: 2.0
      unknown_is_obstacle: true
      transform_tolerance: 0.3
      max_tf_age: 1.0
      max_pose_age: 0.5
      odom_timeout: 0.5
      collision_check: auto
      publish_trajectories: false
      trajectory_marker_stride: 4
      debug_publish_rate: 10.0
    FollowPathLA:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.15
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      prune_plan: true
      prune_distance: 1.5
      forward_prune_distance: 1.5
      shorten_transformed_plan: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.1
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.2
      footprint_padding: 0.1
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      track_unknown_space: false
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: LaserScan
          sensor_frame: ''
          marking: true
          clearing: true
          inf_is_valid: false
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
