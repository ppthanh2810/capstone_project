ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    # TF: odom -> base_footprint -> base_link -> laser_frame
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Odometry từ encoder bánh xe: lấy vận tốc tiến và vận tốc quay.
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Odometry từ IMU: lấy yaw và vận tốc quay quanh trục Z.
    odom1: /imu_odom
    odom1_config: [false, false, false,
                   false, false, true,
                   false, false, false,
                   false, false, true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    use_control: false
    transform_time_offset: 0.0
    transform_timeout: 0.0