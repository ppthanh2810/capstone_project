scan_to_scan_filter_chain:
  ros__parameters:
    # Giữ nửa PHÍA TRƯỚC robot, bỏ nửa phía sau.
    # laser_frame xoay yaw = pi so với robot (URDF laser_joint: góc 0 của scan hướng ra sau robot), nên trong laser_frame:
    #   phía trước robot = góc gần ±pi, phía sau robot = góc trong (-pi/2, pi/2).
    # InPlace filter thay các tia NẰM TRONG [lower, upper] bằng NaN (giữ nguyên số tia, angle_min/max).
    filter1:
      name: front_angle
      type: laser_filters/LaserScanAngularBoundsFilterInPlace
      params:
        lower_angle: -1.57
        upper_angle: 1.57
        replace_with_nan: true
