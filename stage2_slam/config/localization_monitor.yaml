# Localization monitor (chỉ chạy khi localization.launch.py monitor:=true). Chỉ công bố
# /localization/status; không điều khiển robot. Ngưỡng là giá trị khởi đầu, CHƯA hiệu chỉnh trên robot
# thật (NOT_VERIFIED).
localization_monitor:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    base_frame: base_footprint
    odom_frame: odom
    rate: 2.0                      # Hz
    amcl_state_service: /amcl/get_state
    score_field:
      sigma: 0.05
      max_distance: 0.5
    preprocess:
      max_range: 12.0
      max_points: 400
    min_valid_points: 60
    # Distance filter (Fox et al. 1999): dò tia trên bản đồ; điểm scan NGẮN hơn bản đồ > short_margin
    # và xa tường (score < match_score) = vật cản chưa có trong map (ghế, người) -> bỏ khỏi
    # scan_consistency. Tia "xuyên tường" vẫn tính -> lạc thật vẫn bị phát hiện.
    # enabled: false -> cách tính cũ (mọi điểm). /localization/status có cả scan_consistency_all
    # (cách cũ) để so sánh. Ngưỡng chọn trên dữ liệu tổng hợp (test_scan_map_consistency) - NOT_VERIFIED.
    distance_filter:
      enabled: true
      short_margin: 0.15
      long_margin: 0.15
      match_score: 0.5
      min_counted_points: 40
    initializing_grace: 3.0        # s sau /initialpose
    scan_age_warn: 0.5
    scan_age_lost: 2.0
    odom_age_warn: 0.3
    odom_age_lost: 1.0
    tf_age_warn: 0.5
    tf_age_lost: 2.0
    std_xy_warn: 0.25
    std_xy_lost: 1.0
    std_yaw_warn: 0.17
    std_yaw_lost: 0.5
    consistency_warn: 0.45          # 0.55 -> 0.45 (2026-10-14): robot dao động 0.46-0.535 khi quay/đi rồi hồi lại
    consistency_lost: 0.30
    consistency_lost_count: 5
    # Tỉ lệ tia bị vật lạ che > ngưỡng -> UNCERTAIN (còn quá ít tường để kiểm tra vị trí).
    # Tấm 1.2 m cách 0.55 m đã che ~62% -> để cao.
    blocked_ratio_warn: 0.85
    jump_linear_warn: 0.30
    jump_angular_warn: 0.26
    jump_hold: 5.0
