# slam_toolbox (async, mapping) cho AMR capstone.
# Gốc: /opt/ros/humble/share/slam_toolbox/config/mapper_params_online_async.yaml
# Các dòng có "# <-" là giá trị đã đổi so với mặc định, kèm lý do.
#
# Phần cứng: RPLIDAR C1 (10 Hz, 5 kHz, đo xa ~12 m), chỉ dùng nửa phía trước (/scan_filtered),
# robot vi sai chậm (joystick 0.2 m/s, 0.6 rad/s), máy Ryzen 5 7535HS 12 luồng.

slam_toolbox:
  ros__parameters:

    # ---------------- Solver ----------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---------------- Frames / topics ----------------
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan_filtered            # <- scan đã bỏ nửa sau (laptop che)
    use_sim_time: false
    mode: mapping

    # ---------------- Tài nguyên / nhịp xử lý ----------------
    debug_logging: false
    throttle_scans: 1                     # xử lý mọi scan đủ điều kiện (đã lọc bằng minimum_travel_*)
    transform_publish_period: 0.05        # <- 20 Hz cho map->odom (mặc định 50 Hz, thừa với robot chậm)
    map_update_interval: 1.0              # <- vẽ lại /map mỗi 1 s (mặc định 5 s, quá chậm)
    resolution: 0.05
    min_laser_range: 0.10                 # <- bỏ điểm sát LiDAR (thân robot)
    max_laser_range: 12.0                 # <- tầm tin cậy của C1; tia dài hơn chỉ tốn raytrace + nhiễu
    minimum_time_interval: 0.2            # <- tối đa 5 scan/s vào SLAM (mặc định 0.5 s)
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false        # <- tắt interactive markers trong RViz: bớt CPU + băng thông
    use_map_saver: true

    # ---------------- Điều kiện thêm scan (node) mới ----------------
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2          # <- mặc định 0.5 m: quá thưa với robot nhỏ, đi chậm
    minimum_travel_heading: 0.2           # <- mặc định 0.5 rad (~29 deg) -> ~11 deg
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ---------------- Loop closure ----------------
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---------------- Scan matcher (giữ mặc định) ----------------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
